# Gate every ssh-agent key use behind the fingerprint reader.
#
# ssh-agent reads SSH_ASKPASS from its OWN environment, so this has to be set
# on the service -- exporting it from a shell has no effect on the running
# agent.
[Service]
Environment=SSH_ASKPASS=/usr/local/bin/ssh-askpass-fprint
# force: a systemd user service has no DISPLAY, and without this ssh-agent
# skips the askpass program entirely rather than falling back to it.
Environment=SSH_ASKPASS_REQUIRE=force
